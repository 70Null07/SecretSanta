# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore SecretSanta.slnx
    - name: Build
      run: dotnet build SecretSanta.slnx --no-restore --configuration Release
    - name: Test
      run: dotnet test SecretSanta.slnx --no-build --configuration Release --verbosity normal
    - name: Build API image
      run: docker build --file SecretSanta.ApiService/Dockerfile --target final --tag secretsanta-api:ci .
    - name: Build Web image
      run: docker build --file SecretSanta.Web/Dockerfile --target final --tag secretsanta-web:ci .
    - name: Validate Compose configuration
      env:
        POSTGRES_DB: secretsanta
        POSTGRES_USER: secretsanta
        POSTGRES_PASSWORD: ci-only-password
        JWT__KEY: ci-only-signing-key-at-least-32-bytes-long
      run: docker compose config --quiet
